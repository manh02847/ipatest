952893aba720809c91a297d9052a93cb6720801096b4911915289b4bb720801090ae9b697528948bf720801094a', 'replacement': 'e9031daafd7bbfa9fd03009120815df821015df8228156f82ac193b80b0b80d242090b9b23015cf824815bf8b5feff9700000052fd7bc1a8c0035fd6'}, {'offset': 82631884, 'original': 'accd1f94', 'replacement': '27fedd97'}, {'offset': 82632840, 'original': 'bdcc1f94', 'replacement': '38fddd97'}, {'offset': 82639760, 'original': '29410071', 'replacement': '29210071'}]}
          import copy,hashlib,json,os,shutil,zipfile
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/'ipa-publish'
          source=work/'source.ipa';dest=work/os.environ['IPA_NAME']
          member='Payload/kgvn.app/Frameworks/aovnet.framework/aovnet'
          def digest(stream):
              h=hashlib.sha256()
              for chunk in iter(lambda:stream.read(4*1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          with source.open('rb') as f:assert digest(f)==PATCH['source_ipa_sha256'],'Original IPA changed'
          with zipfile.ZipFile(source) as src:
              original=src.infolist()
              assert len(original)==562 and sum(i.filename==member for i in original)==1
              binary=bytearray(src.read(member))
              assert hashlib.sha256(binary).hexdigest()==PATCH['prior_framework_sha256']
              for patch in reversed(PATCH['undo_patches']):
                  offset=patch['offset'];before=bytes.fromhex(patch['replacement']);after=bytes.fromhex(patch['original'])
                  assert len(before)==len(after) and binary[offset:offset+len(before)]==before
                  binary[offset:offset+len(after)]=after
              assert hashlib.sha256(binary).hexdigest()==PATCH['source_framework_sha256']
              for patch in PATCH['patches']:
                  offset=patch['offset'];before=bytes.fromhex(patch['original']);after=bytes.fromhex(patch['replacement'])
                  assert len(before)==len(after) and binary[offset:offset+len(before)]==before
                  binary[offset:offset+len(after)]=after
              assert hashlib.sha256(binary).hexdigest()==PATCH['output_framework_sha256']
              replacement=work/'aovnet';replacement.write_bytes(binary)
              with zipfile.ZipFile(dest,'w',allowZip64=True) as out:
                  for info in original:
                      with (replacement.open('rb') if info.filename==member else src.open(info)) as stream:
                          with out.open(copy.copy(info),'w') as target:shutil.copyfileobj(stream,target,4*1024*1024)
                  out.comment=src.comment
          with zipfile.ZipFile(dest) as result:
              infos=result.infolist()
              assert [i.filename for i in infos]==[i.filename for i in original]
              for before,after in zip(original,infos):
                  assert before.external_attr==after.external_attr
                  if before.filename!=member:assert (before.CRC,before.file_size)==(after.CRC,after.file_size)
              with result.open(member) as f:assert digest(f)==PATCH['output_framework_sha256']
              assert result.testzip() is None
          with dest.open('rb') as f:output_hash=digest(f)
          assert output_hash==PATCH['output_ipa_sha256'],'Packaged IPA differs from locally validated build'
          (work/'release_notes.txt').write_text('Bản V2 sửa phần khởi tạo menu. Ký lại IPA trước khi cài. Chưa thử trực tiếp trên iPhone.\n\nSHA-256: '+output_hash+'\n')
          print(json.dumps({'name':dest.name,'size':dest.stat().st_size,'sha256':output_hash,'aovnet_sha256':PATCH['output_framework_sha256']}))
          PY
      - name: Publish IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create 'tele-lythapphong-crashfix-v2-20261011' "$RUNNER_TEMP/ipa-publish/$IPA_NAME" --target "$GITHUB_SHA" --title 'Tele: @lythapphong — V2 sửa khởi tạo' --notes-file "$RUNNER_TEMP/ipa-publish/release_notes.txt"

